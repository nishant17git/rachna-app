name: Build Rachna APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cordova & Build Tools
        run: |
          npm install -g cordova cordova-res

      - name: Add Android Platform & Build APK
        run: |
          cordova platform add android
          cordova-res android --skip-config --copy || true
          cordova build android --debug --buildConfig=build.json
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk platforms/android/app/build/outputs/apk/debug/Rachna.apk

      - name: Upload Rachna APK
        uses: actions/upload-artifact@v4
        with:
          name: Rachna-App
          path: platforms/android/app/build/outputs/apk/debug/Rachna.apk
